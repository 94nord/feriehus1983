name: feriehus1983

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      ADMIN_ADDRESS: ${ADMIN_ADDRESS}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - cms
    mem_limit: 128m

  cms:
    build: ./cms
    image: feriehus1983-cms
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: ${CMS_PUBLIC_URL}
      IS_PROXIED: "true"
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: data/db/data.db
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    volumes:
      - ./data/db:/opt/app/data/db
      - ./data/uploads:/opt/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1337/_health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    mem_limit: 768m

  web:
    build: ./web
    image: feriehus1983-web
    restart: unless-stopped
    environment:
      STRAPI_URL: http://cms:1337
      STRAPI_TOKEN: ${STRAPI_TOKEN}
      STRAPI_CACHE_SECONDS: ${STRAPI_CACHE_SECONDS:-60}
    depends_on:
      cms:
        condition: service_healthy
    mem_limit: 256m

volumes:
  caddy_data:
  caddy_config:
