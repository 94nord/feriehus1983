# Test version of the stack for Playwright. Used together with docker-compose.yml:
#   docker compose -p feriehus1983-test -f docker-compose.yml -f docker-compose.test.yml --env-file tests/.env.test up
# Runs on port 8080 with its own data in data-test/ so it never touches development data.
services:
  caddy:
    ports: !override
      - "8080:8080"

  cms:
    volumes: !override
      - ./data-test/db:/opt/app/data/db
      - ./data-test/uploads:/opt/app/public/uploads
